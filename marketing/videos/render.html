<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rendu vidéo</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fffaf7; }
  body { font-family: "Inter", "Noto Color Emoji", sans-serif; color: #1d1a1f; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(1200px 900px at 50% -10%, #ffe3ea 0%, #fffaf7 60%); }
  /* Zone sûre TikTok : rien d'important sous ~380 px du bas ni dans les 140 px de droite. */
  #hook { position: absolute; top: 150px; left: 70px; right: 140px; text-align: center;
    font-weight: 800; font-size: 72px; line-height: 1.12; letter-spacing: -1.5px; }
  #top { position: absolute; top: 470px; left: 60px; right: 140px; height: 96px; display: flex; align-items: center; gap: 22px;
    border-bottom: 2px solid #ece5ef; }
  #avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #c9b6d9, #f2b3c0); }
  #name { font-weight: 700; font-size: 40px; }
  #area { position: absolute; top: 590px; bottom: 400px; left: 60px; right: 140px; overflow: hidden; }
  #area.nohead { top: 470px; }
  #list { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; gap: 18px; }
  .b { max-width: 82%; width: fit-content; padding: 22px 30px; border-radius: 40px; font-size: 42px; line-height: 1.3; }
  .them { background: #ece7f0; }
  .me { background: #e0405e; color: #fff; margin-left: auto; }
  .ai { background: #fff1d6; border: 3px dashed #f0c46b; margin-left: auto; }
  .ailabel { margin-left: auto; font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #8a6a2a; text-transform: uppercase; margin-top: 12px; }
  .label { font-size: 36px; color: #5f5866; text-align: center; font-weight: 600; padding: 6px 20px; }
  .info { text-align: center; font-size: 38px; color: #5f5866; font-weight: 700; padding: 8px; }
  .typing { width: 150px; height: 84px; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .typing i { width: 18px; height: 18px; border-radius: 50%; background: #9a90a3; display: block; }
  .card { background: #fff; border: 3px solid #ece5ef; border-radius: 36px; padding: 30px 36px; box-shadow: 0 16px 40px rgba(0,0,0,.06); }
  .card .k { font-size: 34px; font-weight: 800; color: #e0405e; margin-bottom: 10px; }
  .card .v { font-size: 44px; line-height: 1.3; }
  #foot { position: absolute; bottom: 300px; left: 0; right: 140px; text-align: center; font-size: 28px; color: #8f8796; }
  #cta { position: absolute; inset: 0; background: #e0405e; color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 30px; text-align: center; padding: 0 120px 200px; opacity: 0; }
  #cta .logo { font-size: 110px; font-weight: 800; letter-spacing: -3px; }
  #cta .t { font-size: 56px; font-weight: 700; line-height: 1.2; }
  #cta .s { font-size: 40px; opacity: .9; }
</style>
</head>
<body>
<div id="stage">
  <div id="hook"></div>
  <div id="top"><div id="avatar"></div><div id="name"></div></div>
  <div id="area"><div id="list"></div></div>
  <div id="foot">Conversation fictive · exemple</div>
  <div id="cta"><div class="logo">Réplique</div><div class="t">Ton coach de séduction IA, en français</div><div class="s">Liste d'attente : lien en bio 👆</div></div>
</div>
<script>
// Rendu déterministe : window.setup(video) puis window.renderAt(t) pour chaque image.
const TYPE_CPS = 36;           // vitesse d'écriture de la suggestion IA (caractères/s)
const CTA_DURATION = 2.0;
const read = (s) => Math.min(3.0, Math.max(0.9, 0.5 + s.length * 0.034));
let items = [], duration = 0, ctaStart = 0;

// Typographie française : espace fine insécable avant ! ? : ; » et après «.
const fr = (s) => s.replace(/ ([!?:;»])/g, "\u202F$1").replace(/« /g, "«\u202F");
function el(cls, html) { const d = document.createElement("div"); d.className = cls; if (html !== undefined) d.textContent = fr(html); return d; }

window.setup = (v) => {
  document.getElementById("hook").textContent = fr(v.hook);
  const hasChat = v.steps.some((s) => ["me", "them", "ai"].includes(s[0])) && v.name;
  document.getElementById("top").style.display = hasChat ? "flex" : "none";
  document.getElementById("area").classList.toggle("nohead", !hasChat);
  document.getElementById("name").textContent = v.name || "";
  document.getElementById("foot").style.display = hasChat ? "" : "none";
  const list = document.getElementById("list");
  list.replaceChildren();
  items = [];
  let t = 0.9; // laisse lire l'accroche
  let prevAi = false;
  for (const [kind, a, b] of v.steps) {
    if (kind === "them") {
      const typing = el("b them typing"); typing.innerHTML = "<i></i><i></i><i></i>";
      list.append(typing); items.push({ node: typing, start: t, end: t + 0.7, kind: "typing" });
      const n = el("b them", a); list.append(n); items.push({ node: n, start: t + 0.7 });
      t += 0.7 + read(a);
    } else if (kind === "me") {
      const n = el("b me", a); list.append(n); items.push({ node: n, start: t }); t += read(a);
    } else if (kind === "ai") {
      if (!prevAi) { const l = el("ailabel", "✨ Suggestion IA"); list.append(l); items.push({ node: l, start: t }); t += 0.45; }
      const n = el("b ai"); list.append(n);
      const typeDur = a.length / TYPE_CPS;
      items.push({ node: n, start: t, text: fr(a), typeDur });
      t += typeDur + Math.min(1.8, 0.5 + a.length * 0.01);
    } else if (kind === "label") {
      const n = el("label", a); list.append(n); items.push({ node: n, start: t }); t += read(a) * 0.9;
    } else if (kind === "info") {
      const n = el("info", a); list.append(n); items.push({ node: n, start: t }); t += Math.max(1.4, read(a));
    } else if (kind === "card") {
      const n = el("card"); n.append(el("k", a), el("v", b)); list.append(n); items.push({ node: n, start: t }); t += 0.3 + read(b);
    }
    prevAi = kind === "ai";
  }
  ctaStart = t + 0.6;
  duration = ctaStart + CTA_DURATION;
  return duration;
};

window.renderAt = (t) => {
  for (const it of items) {
    const visible = t >= it.start && (it.end === undefined || t < it.end);
    it.node.style.display = visible ? "" : "none";
    if (!visible) continue;
    const p = Math.min(1, (t - it.start) / 0.25);
    const e = 1 - Math.pow(1 - p, 3);
    it.node.style.opacity = String(e);
    it.node.style.transform = `translateY(${(1 - e) * 30}px) scale(${0.96 + 0.04 * e})`;
    if (it.kind === "typing") {
      it.node.querySelectorAll("i").forEach((dot, i) => {
        dot.style.transform = `translateY(${Math.sin((t * 9) - i * 0.9) * 7}px)`;
      });
    }
    if (it.text !== undefined) {
      const n = Math.min(it.text.length, Math.floor((t - it.start) * TYPE_CPS));
      const chars = Array.from(it.text);
      it.node.textContent = chars.slice(0, n).join("") + (n < chars.length ? "▍" : "");
    }
  }
  // Défilement : garde le dernier élément visible.
  const area = document.getElementById("area"), list = document.getElementById("list");
  list.style.transform = "translateY(0)";
  const overflow = list.scrollHeight - area.clientHeight;
  list.style.transform = `translateY(${-Math.max(0, overflow)}px)`;
  // Écran final.
  const c = document.getElementById("cta");
  const q = Math.max(0, Math.min(1, (t - ctaStart) / 0.35));
  c.style.opacity = String(q);
  c.style.transform = `scale(${1.04 - 0.04 * q})`;
};
</script>
</body>
</html>
